# SynFIX default configuration.
#
# Point your system under test at localhost:9880 with SenderCompID=TESTCLIENT.
# Override this file by passing a path: java -jar synfix.jar /path/to/my.cfg

[DEFAULT]
FileStorePath=target/data/synfix
FileLogPath=target/log/synfix
UseDataDictionary=Y
DataDictionary=FIX44-synfix.xml
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
ReconnectInterval=5
ValidateUserDefinedFields=Y

# The synthetic counterparty. This is the session your system connects to.
[SESSION]
BeginString=FIX.4.4
SenderCompID=SYNFIX_A
TargetCompID=TESTCLIENT
ConnectionType=acceptor
SocketAcceptPort=9880

# A second, independent session on the same engine process ("crossing sessions").
# Acceptor and initiator sessions can be mixed freely here: each connector claims
# only the sessions whose ConnectionType matches it.
#
# Uncommented, this dials out to a counterparty on 9881 and will retry until
# something is listening. Enable it when you need the engine to originate a
# session rather than only receive one.
#
# [SESSION]
# BeginString=FIX.4.4
# SenderCompID=SYNFIX_B
# TargetCompID=COUNTERPARTY_B
# ConnectionType=initiator
# SocketConnectHost=localhost
# SocketConnectPort=9881
